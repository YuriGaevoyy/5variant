name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DeliveryService.slnx
      - name: Build Release
        run: dotnet build DeliveryService.slnx -c Release --no-restore
      - name: Unit and integration tests
        run: dotnet test DeliveryService.Tests/DeliveryService.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage"
      - name: UI tests
        run: dotnet test DeliveryService.UiTests/DeliveryService.UiTests.csproj -c Release --no-build

  publish-zip:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained client
        run: dotnet publish DeliveryService.Desktop/DeliveryService.Desktop.csproj -c Release -r win-x64 --self-contained true -o output/publish/win-x64
      - name: Archive
        run: Compress-Archive -Path output/publish/win-x64/* -DestinationPath DeliveryService-${{ github.ref_name }}-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DeliveryService-${{ github.ref_name }}-win-x64
          path: DeliveryService-${{ github.ref_name }}-win-x64.zip
